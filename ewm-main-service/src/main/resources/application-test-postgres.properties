# ============================================
# PostgreSQL Test Profile Configuration
# ???????????? ? TestContainers
# ============================================
spring.profiles=test-postgres

# Database Configuration (will be overridden by TestContainers)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Statistics Service URL
stats-server.url=http://localhost:9090

# Server Port (random for tests)
server.port=0

# Logging
logging.level.ru.practicum.stats=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO