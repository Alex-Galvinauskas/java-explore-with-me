spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm-main
    username: ewm-user
    password: ewm-password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql