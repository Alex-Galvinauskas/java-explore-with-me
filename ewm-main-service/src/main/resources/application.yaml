spring:
  datasource:
    url: jdbc:postgresql://main-db:5432/explore_with_me_main
    username: main_user
    password: main_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        # ✅ Критически важно для batch fetching
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: true
    # ✅ Отключаем open-in-view для предотвращения случайных запросов
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql