# Server configuration
server.port=9090
spring.application.name=ewm-stats-service

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/explore_with_me_stats
spring.datasource.username=stats_user
spring.datasource.password=stats_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.ru.practicum=DEBUG
logging.level.org.springframework.web=INFO

# Active profile
# spring.profiles.active=dev