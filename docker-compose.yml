services:
  # База данных для основного сервиса
  main-db:
    image: postgis/postgis:latest
    container_name: explore-with-me-main-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=explore_with_me_main
      - POSTGRES_USER=main_user
      - POSTGRES_PASSWORD=main_password
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main_user -d explore_with_me_main" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explore-with-me-network

  # База данных для сервиса статистики
  stats-db:
    image: postgis/postgis:latest
    container_name: explore-with-me-stats-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=explore_with_me_stats
      - POSTGRES_USER=stats_user
      - POSTGRES_PASSWORD=stats_password
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats_user -d explore_with_me_stats" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explore-with-me-network

  # Сервис статистики
  stats-service:
    build:
      context: .
      dockerfile: ewm-stats-service/Dockerfile
    container_name: explore-with-me-stats-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=9090
    depends_on:
      stats-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - explore-with-me-network

  # Основной сервис
  main-service:
    build:
      context: .
      dockerfile: ewm-main-service/Dockerfile
    container_name: explore-with-me-main-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - STATS_SERVER_URL=http://stats-service:9090
      - SERVER_PORT=8080
    depends_on:
      main-db:
        condition: service_healthy
      stats-service:
        condition: service_healthy
    networks:
      - explore-with-me-network

volumes:
  main-db-data:
  stats-db-data:

networks:
  explore-with-me-network:
    driver: bridge